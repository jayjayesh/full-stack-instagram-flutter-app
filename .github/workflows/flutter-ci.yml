name: Flutter CI

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  flutter-validate:
    name: Flutter Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/instagramflutterapp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Ensure app environment file exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test
