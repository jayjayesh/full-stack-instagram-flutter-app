name: Flutter CI

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  flutter-validate:
    name: Flutter Validate
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: frontend/instagramflutterapp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Create app environment file
        run: echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test
